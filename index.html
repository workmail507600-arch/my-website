    const DAYS_ORDER = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const DAYS_MAP = {
      "Sunday": 0, "Monday": 1, "Tuesday": 2, "Wednesday": 3,
      "Thursday": 4, "Friday": 5, "Saturday": 6
    };

    // সরাসরি খাঁটি IST টাইমজোন অনুযায়ী বর্তমান সময় বের করার আন্তর্জাতিক নিরাপদ মেথড
    function getExactIST() {
      const now = new Date();
      // Intl API দিয়ে সরাসরি Asia/Kolkata সময় বের করা
      const formatter = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Kolkata',
        hour12: false,
        weekday: 'long',
        year: 'numeric',
        month: 'numeric',
        day: 'numeric',
        hour: 'numeric',
        minute: 'numeric',
        second: 'numeric'
      });
      const parts = formatter.formatToParts(now);
      const map = {};
      parts.forEach(p => map[p.type] = p.value);

      return {
        weekday: map.weekday,
        dayIdx: DAYS_MAP[map.weekday],
        hours: parseInt(map.hour, 10),
        minutes: parseInt(map.minute, 10),
        seconds: parseInt(map.second, 10),
        year: parseInt(map.year, 10),
        month: parseInt(map.month, 10),
        day: parseInt(map.day, 10)
      };
    }

    function calculateDiffSeconds(dayOfWeek, timeStr, ist) {
      const parts = timeStr.trim().split(" ");
      const timeParts = parts[0].split(":");
      let targetHour = parseInt(timeParts[0], 10);
      const targetMin = parseInt(timeParts[1], 10);

      if (parts[1].toUpperCase() === "PM" && targetHour < 12) targetHour += 12;
      if (parts[1].toUpperCase() === "AM" && targetHour === 12) targetHour = 0;

      // আজকের দিনে IST হিসেবে কত সেকেন্ড হয়েছে
      const currentSeconds = (ist.hours * 3600) + (ist.minutes * 60) + ist.seconds;
      const targetSeconds = (targetHour * 3600) + (targetMin * 60);

      let diff = targetSeconds - currentSeconds;

      if (dayOfWeek === "Daily") {
        // আজকের নির্ধারিত সময় পার হয়ে গেলে পরের দিনের জন্য +২৪ ঘণ্টা
        if (diff <= 0) {
          diff += 86400;
        }
      } else {
        const targetDayIdx = DAYS_MAP[dayOfWeek];
        if (targetDayIdx !== undefined) {
          let dayDiff = targetDayIdx - ist.dayIdx;
          if (dayDiff < 0 || (dayDiff === 0 && diff <= 0)) {
            dayDiff += 7; // এই সপ্তাহের বার পার হয়ে গেলে পরের সপ্তাহের বারের জন্য +৭ দিন
          }
          diff = (dayDiff * 86400) + targetSeconds - currentSeconds;
        }
      }

      return Math.max(0, diff);
    }

    function getDynamicEpisode(anime, ist) {
      if (anime.episodeText) return anime.episodeText;
      // 2026-09-08 IST
      const refDate = new Date("2026-09-08T00:00:00+05:30");
      const currentDate = new Date(`${ist.year}-${String(ist.month).padStart(2,'0')}-${String(ist.day).padStart(2,'0')}T00:00:00+05:30`);
      const diffDays = Math.floor((currentDate - refDate) / 86400000);

      let add = 0;
      if (anime.dayOfWeek === "Daily") {
        add = Math.max(0, diffDays);
      } else {
        add = Math.max(0, Math.floor(diffDays / 7));
      }
      return "EP " + (anime.baseEp + add);
    }

    let currentSelectedDay = "All";
    let activeList = [...animeList];

    function applyFilters() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const ist = getExactIST();

      activeList = animeList.filter(anime => {
        const matchesQuery = anime.title.toLowerCase().includes(query);
        let matchesDay = true;

        if (currentSelectedDay !== "All") {
          matchesDay = (anime.dayOfWeek === currentSelectedDay || anime.dayOfWeek === "Daily");
        }

        return matchesQuery && matchesDay;
      });

      const sectionTitle = document.getElementById("sectionTitle");
      if (currentSelectedDay === "All") {
        sectionTitle.textContent = "All Ongoing Anime";
      } else {
        sectionTitle.textContent = (currentSelectedDay === ist.weekday)
          ? `Today's Schedule (${currentSelectedDay})`
          : `${currentSelectedDay}'s Schedule`;
      }

      document.getElementById("itemCount").textContent = `${activeList.length} shows`;
      renderCards();
    }

    function selectDay(dayName) {
      currentSelectedDay = dayName;

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.remove("active");
      });
      const activeBtn = document.getElementById(`tab-${dayName}`);
      if (activeBtn) {
        activeBtn.classList.add("active");
        activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }

      applyFilters();
    }

    function onSearchChange() {
      applyFilters();
    }

    function renderCards() {
      const container = document.getElementById("animeContainer");
      const emptyMsg = document.getElementById("emptyMessage");
      container.innerHTML = "";

      if (activeList.length === 0) {
        emptyMsg.classList.remove("hidden");
        return;
      } else {
        emptyMsg.classList.add("hidden");
      }

      const ist = getExactIST();

      activeList.forEach(anime => {
        const langBadges = anime.languages.map(l => 
          `<span class="text-[11px] px-2.5 py-0.5 rounded-md font-medium ${l === 'Hindi' ? 'badge-hindi' : 'badge-lang'}">${l}</span>`
        ).join("");

        const card = document.createElement("div");
        card.className = "card-bg rounded-2xl p-4 shadow-xl";
        card.innerHTML = `
          <div class="flex gap-4">
            <img src="${anime.image}" alt="${anime.title}" class="w-24 h-32 rounded-xl object-cover flex-shrink-0 bg-slate-800 border border-slate-700/50" loading="lazy" />
            <div class="flex flex-col justify-between overflow-hidden flex-1">
              <div>
                <h2 class="font-bold text-[15px] leading-snug tracking-tight text-white mb-1">${anime.title}</h2>
                <div class="flex gap-2 mb-2">
                  <span class="text-xs bg-blue-950 text-blue-400 px-2 py-0.5 rounded-md border border-blue-900 font-medium">${anime.season}</span>
                  <span class="text-xs bg-[#1a263c] text-gray-300 px-2 py-0.5 rounded-md font-medium" id="ep-val-${anime.id}">${getDynamicEpisode(anime, ist)}</span>
                </div>
                <div class="flex flex-wrap gap-1.5 mb-2">
                  ${langBadges}
                </div>
              </div>
              <div class="text-xs text-gray-400 space-y-0.5">
                <div>📅 ${anime.dayOfWeek}</div>
                <div>🕒 ${anime.time}</div>
              </div>
            </div>
          </div>
          <div class="mt-4 pt-3 border-t border-slate-800">
            <div class="text-[10px] font-bold text-center text-gray-400 mb-2 tracking-widest uppercase">NEXT EPISODE</div>
            <div class="grid grid-cols-4 gap-2 text-center">
              <div class="timer-cell p-2 rounded-xl">
                <span class="text-lg font-bold text-white block" id="days-${anime.id}">00</span>
                <span class="text-[9px] font-semibold text-gray-400 tracking-wider">DAYS</span>
              </div>
              <div class="timer-cell p-2 rounded-xl">
                <span class="text-lg font-bold text-white block" id="hours-${anime.id}">00</span>
                <span class="text-[9px] font-semibold text-gray-400 tracking-wider">HRS</span>
              </div>
              <div class="timer-cell p-2 rounded-xl">
                <span class="text-lg font-bold text-white block" id="mins-${anime.id}">00</span>
                <span class="text-[9px] font-semibold text-gray-400 tracking-wider">MIN</span>
              </div>
              <div class="timer-cell p-2 rounded-xl">
                <span class="text-lg font-bold text-white block" id="secs-${anime.id}">00</span>
                <span class="text-[9px] font-semibold text-gray-400 tracking-wider">SEC</span>
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      tick();
    }

    function tick() {
      const ist = getExactIST();

      activeList.forEach(anime => {
        const dEl = document.getElementById(`days-${anime.id}`);
        const hEl = document.getElementById(`hours-${anime.id}`);
        const mEl = document.getElementById(`mins-${anime.id}`);
        const sEl = document.getElementById(`secs-${anime.id}`);
        const epEl = document.getElementById(`ep-val-${anime.id}`);

        if (!dEl || !hEl || !mEl || !sEl) return;

        const totalSecs = calculateDiffSeconds(anime.dayOfWeek, anime.time, ist);

        const days = Math.floor(totalSecs / 86400);
        const hours = Math.floor((totalSecs % 86400) / 3600);
        const mins = Math.floor((totalSecs % 3600) / 60);
        const secs = totalSecs % 60;

        dEl.textContent = String(days).padStart(2, '0');
        hEl.textContent = String(hours).padStart(2, '0');
        mEl.textContent = String(mins).padStart(2, '0');
        sEl.textContent = String(secs).padStart(2, '0');

        if (epEl) {
          epEl.textContent = getDynamicEpisode(anime, ist);
        }
      });
    }

    function sharePage() {
      if (window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.openTelegramLink === 'function') {
        window.Telegram.WebApp.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=Check%20out%20the%20Anime%20Schedule!`);
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert("Link copied to clipboard!");
      }
    }

    // শুরুতে IST দিন স্বয়ংক্রিয়ভাবে শনাক্ত ও সিলেক্ট করা
    const initIST = getExactIST();
    selectDay(initIST.weekday);

    // প্রতি সেকেন্ডে টাইমার অবিরাম চলবে
    setInterval(tick, 1000);
      // Render Upcoming Anime Cards
function renderUpcomingAnime() {
    const container = document.getElementById("upcoming-anime-container");
    if (!container) return;
    container.innerHTML = "";

    upcomingAnimeList.forEach((anime, idx) => {
        const langTags = anime.languages.map(l => {
            const isHindi = l.toLowerCase() === "hindi";
            return `<span style="font-size: 11px; padding: 2px 7px; border-radius: 5px; ${isHindi ? 'background: #ca8a0422; color: #eab308; border: 1px solid #ca8a0488;' : 'background: #1e293b; color: #94a3b8; border: 1px solid #334155;'}">${l}</span>`;
        }).join(" ");

        let scheduleTags = "";
        if (anime.day) scheduleTags += `<span style="font-size: 12px; color: #60a5fa; background: #1e293b; padding: 3px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px;">📅 ${anime.day}</span> `;
        if (anime.time) scheduleTags += `<span style="font-size: 12px; color: #60a5fa; background: #1e293b; padding: 3px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px;">🕒 ${anime.time}</span> `;
        if (anime.displayDate) scheduleTags += `<div style="margin-top: 6px;"><span style="font-size: 12px; color: #facc15; background: #1e293b; padding: 3px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px;">🚀 ${anime.displayDate}</span></div>`;

        let bottomModule = anime.releaseDateIST ? `
            <div style="background: #090e1a; border-radius: 12px; padding: 12px; text-align: center; margin-top: 14px;">
                <div style="font-size: 11px; color: #64748b; font-weight: 700; letter-spacing: 0.8px; margin-bottom: 8px;">RELEASES IN</div>
                <div id="countdown-timer-${idx}" style="display: flex; justify-content: center; gap: 8px;">
                    <div style="background: #172033; padding: 6px 10px; border-radius: 6px; min-width: 44px;"><div class="num-days" style="font-size: 18px; font-weight: 700; color: #fff;">00</div><div style="font-size: 9px; color: #64748b;">DAYS</div></div>
                    <div style="background: #172033; padding: 6px 10px; border-radius: 6px; min-width: 44px;"><div class="num-hrs" style="font-size: 18px; font-weight: 700; color: #fff;">00</div><div style="font-size: 9px; color: #64748b;">HRS</div></div>
                    <div style="background: #172033; padding: 6px 10px; border-radius: 6px; min-width: 44px;"><div class="num-min" style="font-size: 18px; font-weight: 700; color: #fff;">00</div><div style="font-size: 9px; color: #64748b;">MIN</div></div>
                    <div style="background: #172033; padding: 6px 10px; border-radius: 6px; min-width: 44px;"><div class="num-sec" style="font-size: 18px; font-weight: 700; color: #fff;">00</div><div style="font-size: 9px; color: #64748b;">SEC</div></div>
                </div>
            </div>` : `
            <div style="background: #090e1a; border-radius: 12px; padding: 12px; text-align: center; margin-top: 14px;">
                <div style="font-size: 11px; color: #64748b; font-weight: 700; letter-spacing: 0.8px; margin-bottom: 8px;">RELEASES IN</div>
                <div style="background: #eab30815; border: 1px solid #eab30840; color: #facc15; font-size: 13px; font-weight: 500; padding: 9px; border-radius: 8px;">
                    ⚠️ Date Not Announced
                </div>
            </div>`;

        container.innerHTML += `
            <div style="background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 14px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);">
                <div style="display: flex; gap: 12px;">
                    <img src="${anime.image}" alt="${anime.title}" style="width: 95px; height: 138px; border-radius: 8px; object-fit: cover; background: #1e293b;">
                    <div style="flex: 1;">
                        <div style="font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 6px;">${anime.title}</div>
                        <div style="display: flex; gap: 6px; margin-bottom: 8px;">
                            <span style="font-size: 11px; color: #93c5fd; background: #1e293b; border: 1px solid #1d4ed8; padding: 2px 7px; border-radius: 5px;">${anime.season}</span>
                            <span style="font-size: 11px; color: #94a3b8; background: #1e293b; border: 1px solid #334155; padding: 2px 7px; border-radius: 5px;">${anime.statusBadge}</span>
                        </div>
                        <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px;">${langTags}</div>
                        <div>${scheduleTags}</div>
                    </div>
                </div>
                ${bottomModule}
            </div>`;
    });
}

// Bulletproof IST Live Countdown Updater
function startUpcomingTimers() {
    function updateTimers() {
        const nowUTC = new Date().getTime();
        const istOffset = 5.5 * 60 * 60 * 1000;
        const nowIST = nowUTC + (new Date().getTimezoneOffset() * 60 * 1000) + istOffset;

        upcomingAnimeList.forEach((anime, idx) => {
            if (!anime.releaseDateIST) return;

            const targetTime = new Date(anime.releaseDateIST).getTime();
            const diff = targetTime - nowIST;
            const timerElem = document.getElementById(`countdown-timer-${idx}`);

            if (!timerElem) return;

            if (diff <= 0) {
                timerElem.parentElement.innerHTML = `<div style="color: #4ade80; font-weight: 600; padding: 8px;">Released / Airing Now</div>`;
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            const dayBox = timerElem.querySelector('.num-days');
            const hrBox = timerElem.querySelector('.num-hrs');
            const minBox = timerElem.querySelector('.num-min');
            const secBox = timerElem.querySelector('.num-sec');

            if (dayBox) dayBox.innerText = String(d).padStart(2, '0');
            if (hrBox) hrBox.innerText = String(h).padStart(2, '0');
            if (minBox) minBox.innerText = String(m).padStart(2, '0');
            if (secBox) secBox.innerText = String(s).padStart(2, '0');
        });
    }

    updateTimers();
    setInterval(updateTimers, 1000);
}

// Start Rendering & Countdown
renderUpcomingAnime();
startUpcomingTimers();

      
  </script>
