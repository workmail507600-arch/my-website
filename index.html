  <title>RedLineAnime – Anime Schedule</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {

      -webkit-text-fill-color: transparent; font-family: 'Poppins', sans-serif, Arial; }
    .sub { text-align: center; color: var(--accent); font-weight: 700; font-size: 1.05rem; }
    .pill { display: block; width: fit-content; margin: 8px auto 12px; background: var(--card2); border: 1px solid var(--line);
      color: var(--muted); font-size: 12px; padding: 4px 14px; border-radius: 999px; }
    .share { width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--text); padding: 11px;
      border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; }

    .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 2px 4px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-weight: 600;
      font-size: 13px; padding: 9px 16px; border-radius: 14px; cursor: pointer; }
    .tab.active { background: var(--accent); color: #1a1230; border-color: var(--accent); }

    .search { width: 100%; margin: 12px 0; background: var(--card); border: 1px solid var(--line); color: var(--text);
      font-size: 14px; padding: 12px 14px; border-radius: 12px; outline: none; }
    .search:focus { border-color: var(--accent); }

    .count { color: var(--muted); font-size: 12px; margin: 0 2px 6px; }
    .group-head { display: flex; align-items: center; justify-content: space-between; margin: 20px 2px 10px;
      padding: 9px 14px; background: var(--card2); border-left: 4px solid var(--accent); border-radius: 0 12px 12px 0;
      font-weight: 700; font-size: 14px; }
    .group-head.daily { border-left-color: #f59e0b; }
    .group-head small { color: var(--muted); font-weight: 500; font-size: 12px; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 14px; }
    .top { display: flex; gap: 14px; }
    .poster { width: 96px; height: 138px; border-radius: 12px; object-fit: cover; flex: none; background: var(--card2); }
    .info { flex: 1; min-width: 0; }
    .title { font-size: 16px; font-weight: 700; line-height: 1.25; margin: 0 0 4px; color: #fff; }
    .season { color: var(--violet); font-size: 13px; margin-bottom: 8px; }
    .chips, .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .chip { font-size: 10.5px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; border: 1px solid; }
    .l-Hindi { background:#4a1a22; color:#fca5a5; border-color:#7f2a35; }
    .l-Tamil { background:#12382d; color:#6ee7b7; border-color:#1f6150; }
    .l-Telugu { background:#2f2160; color:#c4b5fd; border-color:#4b3a8f; }
    .l-English { background:#17306a; color:#93c5fd; border-color:#27499b; }
    .l-Japanese { background:#4a1a22; color:#fca5a5; border-color:#7f2a35; }
    .l-other { background:#262335; color:#e5e7eb; border-color:#3a3555; }
    .meta { font-size: 12.5px; color: var(--muted); line-height: 1.7; }
    .tag { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px; border: 1px solid; }
    .t-weekly { background:#0f2f3a; color:#67e8f9; border-color:#155e75; }
    .t-daily  { background:#3a2a0f; color:#fbbf24; border-color:#92400e; }
    .t-dub    { background:#2b1a4a; color:#d8b4fe; border-color:#6b21a8; }
    .t-new    { background:#4a1230; color:#f9a8d4; border-color:#9d174d; }

    // ---------- সময়ের হিসাব (সবকিছু IST ঘড়ি ধরে) ----------
    const DAY = 86400000;
    const DAYS_ORDER = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    const WD_IDX = { Sunday: 0, Monday: 1, Tuesday: 2, Wednesday: 3, Thursday: 4, Friday: 5, Saturday: 6 };
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

    function nowIstMs() {
      const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Kolkata', hourCycle: 'h23',
        year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' })
        .formatToParts(new Date());
      const m = {}; parts.forEach(p => m[p.type] = parseInt(p.value, 10));
      return Date.UTC(m.year, m.month - 1, m.day, m.hour, m.minute, m.second);
    }

    function parseTime(t) {
      const p = t.trim().split(" "), tp = p[0].split(":");
      let h = parseInt(tp[0], 10); const mi = parseInt(tp[1], 10) || 0;
      const ap = (p[1] || "").toUpperCase();
      if (ap === "PM" && h < 12) h += 12;
      if (ap === "AM" && h === 12) h = 0;
      return (h * 60 + mi) * 60000;
    }

    function firstReleaseMs(a) {
      const [y, m, d] = a.nextDate.split("-").map(Number);
      return Date.UTC(y, m - 1, d) + parseTime(a.time);
    }

    function fmtDate(ms) {
      const d = new Date(ms);
      let h = d.getUTCHours(); const mi = String(d.getUTCMinutes()).padStart(2, "0");
      const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
      return `${WEEKDAYS[d.getUTCDay()]}, ${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()} at ${h}:${mi} ${ap} IST`;
    }

    // একটা শো-র বর্তমান অবস্থা। null মানে লুকিয়ে রাখো (শেষ বা শুরু হয়নি)।
    function getInfo(a, nowMs) {
      const per = a.epsPerRelease || 1;
      const step = a.dayOfWeek === "Daily" ? DAY : 7 * DAY;
      const first = firstReleaseMs(a);
      const released = nowMs >= first ? Math.floor((nowMs - first) / step) + 1 : 0;
      const last = (a.nextEp - 1) + per * released;       // এ পর্যন্ত আসা শেষ এপিসোড
      if (last < 1) return null;                          // এখনো শুরুই হয়নি
      if (typeof a.totalEp === "number" && last >= a.totalEp) return null; // সিজন শেষ
      const nFirst = a.nextEp + per * released;
      let nLast = nFirst + per - 1;
      if (typeof a.totalEp === "number") nLast = Math.min(nLast, a.totalEp);
      return { last, nFirst, nLast, nextMs: first + released * step };
    }

    // ---------- রেন্ডার ----------
    let currentDay = "All";
    let visible = [];   // [{a, info}]
    let needsRerender = false;

    const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

    function cardHTML(a, info) {
      const langs = (a.languages || []).map(l => `<span class="chip ${/^(Hindi|Tamil|Telugu|English|Japanese)$/.test(l) ? 'l-' + l : 'l-other'}">${esc(l)}</span>`).join("");
      const per = a.epsPerRelease || 1;
      const daily = a.dayOfWeek === "Daily";
      const tags = [
        daily ? `<span class="tag t-daily">🔁 DAILY</span>` : `<span class="tag t-weekly">📅 WEEKLY</span>`,
        a.upcomingDub ? `<span class="tag t-dub">🎙️ UPCOMING DUB</span>` : "",
        a.isNew ? `<span class="tag t-new">🔥 NEW</span>` : ""
      ].join("");
      const total = typeof a.totalEp === "number" ? ` / ${a.totalEp}` : "";
      const nextTxt = info.nFirst === info.nLast ? `Episode ${info.nFirst}` : `Episodes ${info.nFirst}–${info.nLast}`;
      const sched = daily ? `Daily · Airs every day @ ${a.time}` : `Weekly · ${a.dayOfWeek} @ ${a.time}`;
      const url = esc(a.watchUrl || DEFAULT_WATCH_URL);
      return `
      <div class="card" id="card-${a.id}">
        <div class="top">
          <img class="poster" src="${esc(a.image)}" alt="${esc(a.title)}" loading="lazy" onerror="this.style.visibility='hidden'" />
          <div class="info">
            <h2 class="title">${esc(a.title)}</h2>
            <div class="season">${esc(a.season)}</div>
            <div class="chips">${langs}</div>
            <div class="meta">📅 ${sched}<br>📚 ${per} episode(s) per release</div>
            <div class="tags" style="margin-top:6px">${tags}</div>
          </div>
        </div>
        <div class="ep">
          <div class="cur">📺 Episode <b>${info.last}</b>${total}</div>
          <div class="nxt">→ Next: ${nextTxt}</div>
          <div class="when">🗓️ ${fmtDate(info.nextMs)}</div>
        </div>
        <div class="cd">
          <div class="cd-label">⏳ NEXT RELEASE</div>
          <div class="cd-row">
            <div class="cd-cell"><b id="d-${a.id}">00</b><span>DAYS</span></div>
            <div class="cd-cell"><b id="h-${a.id}">00</b><span>HOURS</span></div>
            <div class="cd-cell"><b id="m-${a.id}">00</b><span>MINS</span></div>
            <div class="cd-cell"><b id="s-${a.id}">00</b><span>SECS</span></div>
          </div>
        </div>
        <a class="watch" href="${url}" target="_blank" rel="noopener">▶ Watch Now</a>
      </div>`;
    }

    function dateLabelForDay(dayName, nowMs) {
      const todayIdx = new Date(nowMs).getUTCDay();
      const ahead = (WD_IDX[dayName] - todayIdx + 7) % 7;
      const d = new Date(Math.floor(nowMs / DAY) * DAY + ahead * DAY);
      const txt = `${MONTHS[d.getUTCMonth()].slice(0, 3)} ${d.getUTCDate()}`;
      return ahead === 0 ? `Today · ${txt}` : txt;
    }

    function applyFilters() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const nowMs = nowIstMs();

      visible = [];
      animeList.forEach(a => {
        if (q && !a.title.toLowerCase().includes(q)) return;
        const info = getInfo(a, nowMs);
        if (!info) return;
        visible.push({ a, info });
      });

      // গ্রুপ: ডেইলি সবসময় উপরে, তারপর সোম→রবি (সময় অনুযায়ী সাজানো)
      const byTime = (x, y) => parseTime(x.a.time) - parseTime(y.a.time);
      const groups = [];
      const daily = visible.filter(v => v.a.dayOfWeek === "Daily").sort(byTime);
      if (daily.length) groups.push({ head: "🔁 Daily", sub: "every day", cls: "daily", items: daily });
      DAYS_ORDER.forEach(day => {
        if (currentDay !== "All" && currentDay !== day) return;
        const items = visible.filter(v => v.a.dayOfWeek === day).sort(byTime);
        if (items.length) groups.push({ head: day, sub: dateLabelForDay(day, nowMs), cls: "", items });
      });

      const container = document.getElementById("animeContainer");
      container.innerHTML = groups.map(g => `
        <div class="group-head ${g.cls}"><span>${g.head}</span><small>${g.sub} · ${g.items.length} show${g.items.length > 1 ? "s" : ""}</small></div>
        ${g.items.map(v => cardHTML(v.a, v.info)).join("")}`).join("");

      // কাউন্ট ও টিক-লিস্ট শুধু যা সত্যিই দেখানো হচ্ছে
      visible = groups.flatMap(g => g.items);
      document.getElementById("itemCount").textContent = `${visible.length} shows`;
      document.getElementById("emptyMessage").classList.toggle("hidden", visible.length > 0);
      needsRerender = false;
      tick();
    }

    function tick() {
      const nowMs = nowIstMs();
      for (const v of visible) {
        const diff = Math.floor((v.info.nextMs - nowMs) / 1000);
        if (diff <= 0) { needsRerender = true; continue; }
        const set = (p, val) => { const el = document.getElementById(`${p}-${v.a.id}`); if (el) el.textContent = String(val).padStart(2, "0"); };
        set("d", Math.floor(diff / 86400));
        set("h", Math.floor((diff % 86400) / 3600));
        set("m", Math.floor((diff % 3600) / 60));
        set("s", diff % 60);
      }
      if (needsRerender) applyFilters(); // রিলিজ হলে এপিসোড নম্বর ও পরের সময় নতুন করে হিসাব
    }

    // ---------- ট্যাব ----------
    function buildTabs() {
      const items = [["All", "All days"], ["Monday", "Mon"], ["Tuesday", "Tue"], ["Wednesday", "Wed"],
        ["Thursday", "Thu"], ["Friday", "Fri"], ["Saturday", "Sat"], ["Sunday", "Sun"]];
      document.getElementById("tabs").innerHTML = items.map(([k, l]) =>
        `<button class="tab" id="tab-${k}" onclick="selectDay('${k}')">${l}</button>`).join("");
    }
    function selectDay(day) {
      currentDay = day;
      document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById(`tab-${day}`);
      if (btn) { btn.classList.add("active"); btn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" }); }
      applyFilters();
    }

    function sharePage() {
      if (window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.openTelegramLink === 'function') {
        window.Telegram.WebApp.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(location.href)}&text=Check%20out%20the%20Anime%20Schedule!`);
      } else {
        navigator.clipboard.writeText(location.href).then(() => alert("Link copied to clipboard!"), () => alert(location.href));
      }
    }

    // ডেটা চেক: nextDate-এর বার আর dayOfWeek না মিললে কনসোলে সতর্ক করবে
    animeList.forEach(a => {
      if (a.dayOfWeek === "Daily") return;
      const wd = WEEKDAYS[new Date(firstReleaseMs(a)).getUTCDay()];
      if (wd !== a.dayOfWeek) console.warn(`[schedule] "${a.title}": nextDate ${a.nextDate} is ${wd}, but dayOfWeek is ${a.dayOfWeek}`);
    });

    buildTabs();
    selectDay("All");
    setInterval(tick, 1000);
  </script>
</body>
</html>
